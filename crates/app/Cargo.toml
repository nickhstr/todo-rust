[package]
name         = "todo-app"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }

[lib]
name = "todo_app"
path = "src/lib.rs"

[[bin]]
name = "todo-app"
path = "src/main.rs"

[dependencies]
todo-domain        = { workspace = true }
todo-storage       = { workspace = true }
todo-observability = { workspace = true }
todo-i18n          = { workspace = true }
unic-langid        = { workspace = true }

anyhow                      = { workspace = true }
base64                      = { workspace = true }
async-trait                 = { workspace = true }
axum                        = { workspace = true }
axum-extra                  = { workspace = true }
axum-login                  = { workspace = true }
config                      = { workspace = true }
dotenvy                     = { workspace = true }
fred                        = { workspace = true }
hex                         = { workspace = true }
hyper                       = { workspace = true }
listenfd                    = { workspace = true }
metrics                     = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
mimalloc                    = { workspace = true }
minijinja                   = { workspace = true }
minijinja-autoreload        = { workspace = true }
password-auth               = { workspace = true }
rand                        = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
sqlx                        = { workspace = true }
thiserror                   = { workspace = true }
time                        = { workspace = true }
time-tz                     = { workspace = true }
tokio                       = { workspace = true }
tower                       = { workspace = true }
tower-http                  = { workspace = true }
tower-sessions              = { workspace = true }
tower-sessions-sqlx-store   = { workspace = true }
tracing                     = { workspace = true }
uuid                        = { workspace = true }
validator                   = { workspace = true }

mime       = "0.3"
mime_guess = "2.0"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
# `hex` is already a non-dev dep; dev-deps below are the test-only additions.
regex                  = "1"
reqwest                = { workspace = true }
scraper                = "0.20"
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }
tokio                  = { workspace = true }
