[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/assets",
    "crates/domain",
    "crates/i18n",
    "crates/observability",
    "crates/storage",
]

[workspace.package]
edition      = "2021"
rust-version = "1.82"
license      = "MIT OR Apache-2.0"
publish      = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Web
axum       = { version = "0.7", features = ["macros", "tokio", "http2"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tower      = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = [
    "trace",
    "compression-gzip",
    "compression-br",
    "request-id",
    "set-header",
    "fs",
    "cors",
    "timeout",
    "catch-panic",
    "sensitive-headers",
    "normalize-path",
] }
hyper      = "1.4"

# Auth & sessions
axum-login                = "0.16"
tower-sessions            = { version = "0.13", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.14", features = ["postgres"] }
password-auth             = "1.0"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "time",
    "macros",
    "migrate",
] }

# Cache
fred = { version = "9.4", default-features = false, features = [
    "enable-rustls-ring",
    "metrics",
    "i-keys",
] }

# Templates
minijinja            = { version = "2.3", features = ["loader", "json"] }
minijinja-autoreload = "2.3"

# Serialization
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
serde_with  = "3.9"

# Errors
thiserror = "1.0"
anyhow    = "1.0"

# Observability
tracing                            = "0.1"
tracing-subscriber                 = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-opentelemetry              = "0.27"
opentelemetry                      = "0.26"
opentelemetry_sdk                  = { version = "0.26", features = ["rt-tokio", "trace", "logs"] }
opentelemetry-otlp                 = { version = "0.26", features = ["grpc-tonic", "trace", "logs"] }
opentelemetry-semantic-conventions = "0.26"
opentelemetry-appender-tracing     = "0.26"
metrics                            = "0.23"
metrics-exporter-prometheus        = "0.15"

# Utilities
uuid        = { version = "1.10", features = ["v4", "v7", "serde"] }
time        = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
config      = { version = "0.14", features = ["toml", "yaml"] }
dotenvy     = "0.15"
listenfd    = "1.0"
mimalloc    = { version = "0.1", default-features = false }
validator   = { version = "0.18", features = ["derive"] }
hex         = "0.4"
rand        = "0.8"
async-trait = "0.1"

# Test deps
testcontainers         = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "valkey"] }
reqwest                = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
tempfile               = "3"

# Internationalization
fluent           = "0.16"
fluent-bundle    = "0.15"
fluent-templates = "0.13"
fluent-langneg   = "0.13"
unic-langid      = "0.9"
time-tz          = { version = "2.0", features = ["system"] }
icu              = { version = "1.5", features = ["compiled_data"] }

# Asset hashing
sha2   = "0.10"
base64 = "0.22"

# Internal crates
todo-domain        = { path = "crates/domain" }
todo-storage       = { path = "crates/storage" }
todo-observability = { path = "crates/observability" }
todo-i18n          = { path = "crates/i18n" }
todo-assets        = { path = "crates/assets" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
debug = "limited"
