apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
data:
  RUST_LOG: "info,todo_app=info,sqlx=warn,tower_http=info"

  # REDIS_URL points at the in-namespace Valkey service.
  REDIS_URL: "redis://valkey:6379"

  APP__AUTH__COOKIE_SECURE: "true"

  # OTel exports to the in-cluster collector (Plan 3). Overlays that don't
  # run the observability stack (e.g., `local/`) patch this to "false".
  APP__OBSERVABILITY__OTEL_ENABLED: "true"
  APP__OBSERVABILITY__OTEL_ENDPOINT: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
  APP__OBSERVABILITY__LOG_FORMAT: "json"

  # template autoreload off in prod-shaped envs
  APP__TEMPLATE_AUTORELOAD: "false"
