---
apiVersion: apps/v1
kind: Deployment
metadata: { name: todo-app }
spec:
  replicas: 2
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: todo-app }
spec:
  rules:
    - host: todo.nickhstr.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-app
                port: { number: 80 }
  tls:
    - hosts: [todo.nickhstr.dev]
      secretName: todo-app-tls
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: { name: todo-postgres }
spec:
  instances: 2
  storage:
    size: 10Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://todo-app-tofu-state/wal/prod
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-creds
          key: access_key
        secretAccessKey:
          name: cnpg-s3-creds
          key: secret_key
      wal:
        compression: gzip
        maxParallel: 4
    retentionPolicy: "30d"
