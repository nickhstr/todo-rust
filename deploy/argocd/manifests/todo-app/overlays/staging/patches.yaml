---
# Replicas: 1 (HPA still active 1→6 but base load is low)
apiVersion: apps/v1
kind: Deployment
metadata: { name: todo-app }
spec:
  replicas: 1
---
# Set the staging host on the Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: todo-app }
spec:
  rules:
    - host: staging.todo.nickhstr.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-app
                port: { number: 80 }
  tls:
    - hosts: [staging.todo.nickhstr.dev]
      secretName: todo-app-tls
---
# CNPG cluster: 1 instance, 5Gi (same as base — explicit for clarity)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: { name: todo-postgres }
spec:
  instances: 1
  storage:
    size: 5Gi
