apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-pr-token
  namespace: argocd
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: github-pr-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: github-pr-token
        property: token
