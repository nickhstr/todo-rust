{% extends "base.html" %}

{% block title %}Log in — Quiet Ledger{% endblock %}

{% block content %}
<section class="measure pt-6">

  <div class="anim-fade-up" style="animation-delay: 40ms;">
    <p class="eyebrow">Return</p>
    <h1 class="mt-3 text-[2.25rem] sm:text-[2.75rem] leading-[1.05]" style="font-weight: 400;">
      Welcome back to <em class="not-italic" style="color: var(--color-vermillion);">your ledger.</em>
    </h1>
  </div>

  {% if error %}
    <div class="notice mt-8 anim-fade-up" role="alert" style="animation-delay: 80ms;">
      <span aria-hidden="true">&#10033;</span>
      <span>{{ error }}</span>
    </div>
  {% endif %}

  <form class="mt-10 space-y-7 anim-fade-up"
        style="animation-delay: 140ms;"
        method="post"
        action="/login"
        hx-post="/login"
        hx-target="body"
        hx-push-url="true">

    {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <div>
      <label for="email" class="field-label">Address</label>
      <input id="email" name="email" type="email" required
             autocomplete="email" inputmode="email"
             placeholder="you@somewhere.quiet"
             class="field">
    </div>

    <div>
      <label for="password" class="field-label">Pass-phrase</label>
      <input id="password" name="password" type="password" required
             autocomplete="current-password" minlength="1"
             placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
             class="field">
    </div>

    <div class="pt-4 flex items-center justify-between gap-4">
      <a href="/signup" class="btn-link">No account yet?</a>
      <button type="submit" class="btn btn-primary">Enter</button>
    </div>
  </form>

</section>
{% endblock %}
